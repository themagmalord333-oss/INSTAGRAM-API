version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: always

  api:
    build: .
    command: sh -c "gunicorn app.main:app -w $${FASTAPI_WORKERS:-4} -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"
    environment:
      - API_ENV=production
      - FASTAPI_WORKERS=${FASTAPI_WORKERS:-4}
      - MONGO_URI=mongodb://mongo:27017
      - REDIS_URI=redis://redis:6379
    depends_on:
      - mongo
      - redis
    deploy:
      replicas: 3

  worker:
    build: .
    command: arq app.worker.WorkerSettings
    environment:
      - API_ENV=production
      - MONGO_URI=mongodb://mongo:27017
      - REDIS_URI=redis://redis:6379
    depends_on:
      - mongo
      - redis
    deploy:
      replicas: 2

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "500mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data: